baseURL = "https://galiulin.github.io/"
title = "G_Arthur"
theme = "PaperModX"
paginate = 10
enableRobotsTXT = true
enableInlineShortcodes = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "nord"
    lineNos = false
    noClasses = false

[params]
  env = "production"
  author = "G_Arthur"
  description = "Notes and cheat sheets about what I learn."
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableSpecial1stPost = true
  ShowToc = true
  TocOpen = false
  TocSide = "right"
  EnableInstantClick = false
  EnableImageZoom = true
  displayFullLangName = true
  mainSections = ["posts"]

  socialIcons = [
    { name = "github-simple",   url = "https://github.com/galiulin" },
    { name = "telegram-simple", url = "https://t.me/G_Arthur" },
    { name = "rss-simple",      url = "index.xml" },
  ]

  editPost = { URL = "https://github.com/galiulin/galiulin.github.io/edit/master/content", Text = "Edit on GitHub", appendFilePath = true }

[languages]
  [languages.en]
    languageName = "en"
    languageCode = "en-US"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      description = "Notes and cheat sheets about what I learn."
    [languages.en.menu]
      main = [
        { name = "Archive", url = "/archives/", weight = 5 },
        { name = "Tags",    url = "/tags/",     weight = 6 },
        { name = "Search",  url = "/search/",   weight = 10 },
        { name = "About",   url = "/about/",    weight = 20 },
      ]

  [languages.ru]
    languageName = "ru"
    languageAltTitle = "RU"
    languageCode = "ru-RU"
    weight = 2
    contentDir = "content/ru"
    [languages.ru.params]
      description = "Заметки и шпаргалки о том, что изучаю."
    [languages.ru.menu]
      main = [
        { name = "Записи",  url = "/archives/", weight = 5 },
        { name = "Теги",    url = "/tags/",     weight = 6 },
        { name = "Поиск",   url = "/search/",   weight = 10 },
        { name = "Обо мне", url = "/about/",    weight = 20 },
      ]

[permalinks]
  posts = "/:year/:month/:slug/"